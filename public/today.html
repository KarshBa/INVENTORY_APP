<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Today's Shrink</title>
  <link rel="stylesheet" href="style.css?v=1" />
  <style>
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 0.5rem; border-bottom: 1px solid #ddd; vertical-align: middle; }
    th { background:#0077cc; color:#fff; position:sticky; top:0; }
    .tiny { width: 90px; }
    .actions { display:flex; gap:.35rem; }
    .actions button { padding:.25rem .5rem; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Today's Shrink Entries</h1>
    <div class="card" style="overflow-x:auto;">
      <table id="today-table">
        <thead>
          <tr>
            <tr>
              <th>Time</th>
              <th>List</th>
              <th>Item Code</th>
              <th>Brand</th>
              <th>Description</th>
              <th class="tiny">Qty</th>
              <th class="tiny">Price</th>
              <th>Contribute</th>
              <th class="tiny">Actions</th>
            </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

    <section id="msg" class="hidden"></section>
  </div>

  <script src="today.js"></script>
</body>
</html>
