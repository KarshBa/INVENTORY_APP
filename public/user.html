<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inventory Shrink Tracker</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    /* small inline patch to keep style cozy/simple */
    .mode-row{
      display:flex; gap:1rem; align-items:center; margin:.35rem 0 .75rem;
      font-size:0.95rem;
    }
    .mode-row label{ display:flex; gap:.35rem; align-items:center; cursor:pointer; }
    .mode-row input[type="radio"]{ transform: translateY(1px); }
    .note{ font-size:.9rem; opacity:.8; margin-top:.25rem; }

    #openCameraBtn{
      padding: .45rem .7rem;
      border-radius: 8px;
      border: 1px solid #ccc;
      background: #f7f4ee;
      cursor: pointer;
    }
    #openCameraBtn:hover{ filter: brightness(0.98); }
   </style>
</head>
<body>
  <div class="container">
    <h1>Inventory Shrink Tracker</h1>

    <div class="card">
      <label for="listSelect">Select List</label>
      <select id="listSelect"></select>
    </div>

    <form id="code-form" class="card">
  <a class="today-btn" href="today.html" target="_blank" rel="noopener noreferrer">
    Today’s Entries
  </a>

  <label for="itemCode">Enter Item Code</label>

      <!-- NEW: UPC vs PLU mode -->
      <div class="mode-row" role="radiogroup" aria-label="Entry mode">
        <label>
          <input type="radio" name="entryMode" value="upc" checked>
          <span class="mode-btn upc">UPC</span>
        </label>

        <label>
          <input type="radio" name="entryMode" value="plu">
          <span class="mode-btn plu">Scale PLU</span>
        </label>
      </div>
            <div style="display:flex; gap:0.5rem; align-items:center;">
              <input type="text" id="itemCode" required style="flex:1;" />
              <button type="button" id="openCameraBtn">Open Camera</button>
            </div>
      <div class="note" id="mode-note"></div>
      <button type="submit">Next</button>
    </form>

    <form id="detail-form" class="card hidden">
      <div class="field">
        <label for="subdept">Sub-Department</label>
        <input type="text" id="subdept" readonly />
      </div>

      <div class="field">
        <label for="brand">Brand</label>
        <input type="text" id="brand" readonly />
      </div>

      <div class="field">
        <label for="description">Description</label>
        <input type="text" id="description" readonly />
      </div>

      <div class="field">
        <label for="quantity">Quantity Shrunk</label>
        <input type="number" step="0.01" id="quantity" required />
      </div>

      <div class="field">
        <label for="price">Price ($)</label>
        <input type="number" step="0.01" id="price" readonly />
      </div>

      <!-- NEW: Contribute checkbox -->
      <div class="field contribute-row">
        <input type="checkbox" id="contribute" />
        <label for="contribute" class="contribute-label">Contribute</label>
      </div>


      <button type="submit">Record Shrink</button>
    </form>

        <section id="success-msg" class="hidden"></section>
  </div>

  <!-- 🔍 Scanner Modal -->
  <div id="scannerModal" class="hidden" style="
    position:fixed; inset:0; background:rgba(0,0,0,0.7);
    display:flex; align-items:center; justify-content:center; z-index:9999;
  ">
    <div style="
      width:min(92vw,520px); background:#fff; border-radius:12px;
      padding:0.75rem; box-shadow:0 10px 30px rgba(0,0,0,0.35);
    ">
      <div style="display:flex; justify-content:space-between; align-items:center; gap:0.5rem;">
        <div style="font-weight:700;">Scan Barcode</div>
        <button type="button" id="closeScannerBtn" aria-label="Close scanner">✕</button>
      </div>

      <div style="position:relative; margin-top:0.5rem; border-radius:10px; overflow:hidden; background:#000;">
        <video id="scannerVideo" autoplay playsinline muted style="width:100%; height:auto;"></video>

        <!-- aiming box -->
        <div style="
          position:absolute; inset:12% 8%; border:2px dashed rgba(255,255,255,0.9);
          border-radius:8px; pointer-events:none;
        "></div>
      </div>

      <div id="scannerStatus" style="margin-top:0.5rem; font-size:0.95rem; color:#333;">
        Point your camera at a barcode…
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
