<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inventory Shrink Tracker</title>
  <link rel="stylesheet" href="style.css?v=1" />
  <style>
    /* small inline patch to keep style cozy/simple */
    .mode-row{
      display:flex; gap:1rem; align-items:center; margin:.35rem 0 .75rem;
      font-size:0.95rem;
    }
    .mode-row label{ display:flex; gap:.35rem; align-items:center; cursor:pointer; }
    .mode-row input[type="radio"]{ transform: translateY(1px); }
    .note{ font-size:.9rem; opacity:.8; margin-top:.25rem; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Inventory Shrink Tracker</h1>

    <div class="card">
      <label for="listSelect">Select List</label>
      <select id="listSelect"></select>
    </div>

    <form id="code-form" class="card">
  <a class="today-btn" href="today.html" target="_blank" rel="noopener noreferrer">
    Today’s Entries
  </a>

  <label for="itemCode">Enter Item Code</label>

      <!-- NEW: UPC vs PLU mode -->
      <div class="mode-row" role="radiogroup" aria-label="Entry mode">
        <label>
          <input type="radio" name="entryMode" value="upc" checked>
          <span class="mode-btn upc">UPC</span>
        </label>

        <label>
          <input type="radio" name="entryMode" value="plu">
          <span class="mode-btn plu">Scale PLU</span>
        </label>
      </div>


      <input type="text" id="itemCode" required />
      <div class="note" id="mode-note"></div>

      <button type="submit">Next</button>
    </form>

    <form id="detail-form" class="card hidden">
      <div class="field">
        <label for="subdept">Sub-Department</label>
        <input type="text" id="subdept" readonly />
      </div>

      <div class="field">
        <label for="brand">Brand</label>
        <input type="text" id="brand" readonly />
      </div>

      <div class="field">
        <label for="description">Description</label>
        <input type="text" id="description" readonly />
      </div>

      <div class="field">
        <label for="quantity">Quantity Shrunk</label>
        <input type="number" step="0.01" id="quantity" required />
      </div>

      <div class="field">
        <label for="price">Price ($)</label>
        <input type="number" step="0.01" id="price" readonly />
      </div>

        <!-- Contribute + Reduction row -->
        <div class="field contribute-row">
          <input type="checkbox" id="contribute" />
          <label for="contribute" class="contribute-label">Contribute</label>

          <input type="checkbox" id="reduction" />
          <label for="reduction" class="reduction-label">Reduction</label>
      </div>

      <!-- NEW: Reduction amount field (hidden until checked) -->
      <div class="field hidden" id="reduction-wrapper">
        <label for="reductionAmount">Enter Reduction Amount</label>
        <input type="number" step="0.01" id="reductionAmount" />
      </div>

      <button type="submit">Record Shrink</button>
    </form>

    <section id="success-msg" class="hidden"></section>
  </div>

  <script src="app.js?v=1"></script>
</body>
</html>
